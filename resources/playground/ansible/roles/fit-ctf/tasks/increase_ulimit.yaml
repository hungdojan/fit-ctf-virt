- name: Increase Linux keyring quotas
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-container-keyring.conf
  loop:
    - { name: "kernel.keys.maxkeys", value: "1000" }
    - { name: "kernel.keys.maxbytes", value: "100000" }
